version: '3.8'

services:
  # OpenOrangeAI Application
  openorangeai:
    build:
      context: .
      dockerfile: Dockerfile
    image: openorangeai:latest
    container_name: openorangeai
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/dev.db
      - OLLAMA_BASE_URL=http://ollama:11434
      # Optional: OpenAI / Cloud LLM API configurations
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_BASE_URL=https://api.openai.com/v1
    volumes:
      - openorangeai_data:/app/data
      - openorangeai_uploads:/app/uploads
    depends_on:
      - ollama
    networks:
      - openorangeai_network

  # Ollama Local LLM Runner (Optional, runs local models like llama3, qwen2.5, deepseek-r1)
  ollama:
    image: ollama/ollama:latest
    container_name: openorangeai_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - openorangeai_network
    # GPU Acceleration (Uncomment if you have NVIDIA GPU on Linux/WSL2)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  openorangeai_network:
    driver: bridge

volumes:
  openorangeai_data:
    driver: local
  openorangeai_uploads:
    driver: local
  ollama_models:
    driver: local
